<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giardino Segreto - Panel de Administración</title>

    <link rel="stylesheet" href="CSS/catalogo.css">
    <link rel="stylesheet" href="CSS/navbar.css">

    <!-- Fuentes -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Poppins:wght@300;400;600&display=swap">

    <!-- Íconos -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

    <!-- JavaScript -->
    <script src="JS/menu.js" defer></script>
    <script src="JS/catalago.js" defer></script>
</head>


<body>

    <!-- ENCABEZADO DE SECCIÓN -->
    <section class="banner-seccion">
        <span class="etiqueta-seccion">PANEL CRUD</span>
        <h1>Catálogo de Productos</h1>
        <p>Gestión interna de inventario, precios y stock para el Administrador.</p>
    </section>

    <main class="contenedor-catalogo">

        <!-- BOTÓN PARA AGREGAR PRODUCTOS -->
        <div class="acciones-catalogo">
            <button id="btn-mostrar-formulario" type="button" class="btn-principal">
                <span class="material-symbols-outlined">add_circle</span>
                Agregar Nuevo Producto
            </button>
        </div>

        <!-- FORMULARIO PARA AGREGAR PRODUCTOS -->
        <form id="formulario-producto" class="formulario-producto" hidden>
            <h2>Nuevo Producto</h2>

            <div class="campo-grupo">
                <label for="nombre-producto">Nombre:</label>
                <input type="text" id="nombre-producto" placeholder="Ej: Ramo de Rosas" required>
            </div>

            <div class="campo-grupo">
                <label for="descripcion-producto">Descripción:</label>
                <input type="text" id="descripcion-producto" placeholder="Detalle del arreglo floral" required>
            </div>

            <div class="campo-grupo">
                <label for="precio-producto">Precio ($):</label>
                <input type="number" id="precio-producto" min="0" placeholder="0.00" required>
            </div>

            <div class="campo-grupo">
                <label for="stock-producto">Stock:</label>
                <input type="number" id="stock-producto" min="0" placeholder="Cantidad disponible" required>
            </div>

            <div class="form-botones">
                <button type="submit" class="btn-guardar">Guardar Producto</button>
                <button type="button" id="btn-cancelar" class="btn-cancelar">Cancelar</button>
            </div>
        </form>

        <!-- TABLA DE PRODUCTOS -->
        <section class="catalogo-productos">
            <h2>Productos Registrados</h2>

            <div class="tabla-contenedor">
                <table class="tabla-productos">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th>Precio</th>
                            <th>Stock</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-productos">
                        <tr>
                            <td colspan="6" style="text-align: center; padding: 25px; color: #777;">Cargando productos...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 Giardino Segreto. Todos los derechos reservados.</p>
    </footer>

    <!-- JAVASCRIPT -->
    <script src="JS/catalago.js"></script>

</body>
</html>
